<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E2A4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE55C;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#F0C000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#F0C000;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBarSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBarTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vaultGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </linearGradient>
    <filter id="barShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  <ellipse cx="400" cy="250" rx="350" ry="200" fill="url(#vaultGlow)"/>
  <!-- Stack of 4 gold bars with 3D perspective -->
  <g transform="translate(180, 120)" filter="url(#barShadow)">
    <!-- Bar 1 (bottom) -->
    <g>
      <path d="M0,0 L320,0 L340,20 L20,20 Z" fill="url(#goldBarSide)"/>
      <path d="M320,0 L340,20 L340,100 L320,80 Z" fill="#B8860B"/>
      <rect x="0" y="0" width="320" height="80" fill="url(#goldBar)"/>
      <rect x="0" y="0" width="320" height="80" fill="url(#goldBarTop)"/>
      <rect x="20" y="12" width="280" height="16" rx="2" fill="#FFF8DC" opacity="0.25"/>
      <text x="160" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#8B6914">999.9 FINE GOLD</text>
      <text x="160" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8B6914">1 KILOGRAM • LBMA GOOD DELIVERY</text>
      <rect x="30" y="48" width="260" height="1" fill="#8B6914" opacity="0.3"/>
      <text x="160" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8B6914" opacity="0.6">MELTER: VALCAMBI SUISSE • SERIAL: AU-2024-045211</text>
    </g>
    <!-- Bar 2 -->
    <g transform="translate(20, -75)">
      <path d="M0,0 L280,0 L295,15 L15,15 Z" fill="url(#goldBarSide)"/>
      <path d="M280,0 L295,15 L295,90 L280,75 Z" fill="#B8860B"/>
      <rect x="0" y="0" width="280" height="70" fill="url(#goldBar)"/>
      <rect x="0" y="0" width="280" height="70" fill="url(#goldBarTop)"/>
      <rect x="15" y="10" width="250" height="14" rx="2" fill="#FFF8DC" opacity="0.25"/>
      <text x="140" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#8B6914">999.9 FINE GOLD</text>
      <text x="140" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8B6914">1 KILOGRAM</text>
    </g>
    <!-- Bar 3 -->
    <g transform="translate(40, -145)">
      <path d="M0,0 L240,0 L250,12 L10,12 Z" fill="url(#goldBarSide)"/>
      <path d="M240,0 L250,12 L250,80 L240,68 Z" fill="#B8860B"/>
      <rect x="0" y="0" width="240" height="65" fill="url(#goldBar)"/>
      <rect x="0" y="0" width="240" height="65" fill="url(#goldBarTop)"/>
      <rect x="10" y="8" width="220" height="12" rx="2" fill="#FFF8DC" opacity="0.25"/>
      <text x="120" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#8B6914">999.9 FINE GOLD</text>
    </g>
    <!-- Bar 4 (top) -->
    <g transform="translate(60, -210)">
      <path d="M0,0 L200,0 L205,10 L5,10 Z" fill="url(#goldBarSide)"/>
      <path d="M200,0 L205,10 L205,70 L200,60 Z" fill="#B8860B"/>
      <rect x="0" y="0" width="200" height="60" fill="url(#goldBar)"/>
      <rect x="0" y="0" width="200" height="60" fill="url(#goldBarTop)"/>
      <rect x="5" y="6" width="190" height="10" rx="2" fill="#FFF8DC" opacity="0.25"/>
      <text x="100" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#8B6914">999.9 FINE GOLD</text>
    </g>
  </g>
  <!-- Side stack -->
  <g transform="translate(600, 180)" filter="url(#barShadow)">
    <path d="M0,0 L60,0 L70,240 L10,240 Z" fill="url(#goldBarSide)"/>
    <path d="M60,0 L70,240 L70,260 L60,20 Z" fill="#B8860B"/>
    <rect x="0" y="0" width="60" height="240" fill="url(#goldBar)"/>
    <rect x="5" y="60" width="50" height="120" fill="#FFF8DC" opacity="0.15"/>
    <text x="30" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#8B6914" transform="rotate(-90, 30, 180)">×4 BARS</text>
  </g>
  <!-- Vault door hint -->
  <g transform="translate(60, 380)" opacity="0.3">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="10,10"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FFD700" stroke-width="1"/>
    <g fill="#FFD700">
      <circle cx="0" cy="-80" r="5"/>
      <circle cx="80" cy="0" r="5"/>
      <circle cx="0" cy="80" r="5"/>
      <circle cx="-80" cy="0" r="5"/>
    </g>
  </g>
  <!-- Sparkles -->
  <g filter="url(#glow)">
    <circle cx="200" cy="100" r="4" fill="#FFF8DC" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="60" r="3" fill="#FFF8DC" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="200" r="3.5" fill="#FFF8DC" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="280" r="2.5" fill="#FFF8DC" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFD700" opacity="0.9">GOLD BULLION VAULT • 1KG LBMA BARS</text>
  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8B8B8B" opacity="0.7">ALLOCATED STORAGE • FULLY INSURED • AUDITED QUARTERLY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E2A4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="platBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F0F0;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#D8D8E0;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#C0C0C8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D0D0D8;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#C0C0C8;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#D8D8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0B0B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pallBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8F0;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#D0D0E0;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#B8B8C8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8C8D8;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#B8B8C8;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#D0D0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A8B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barSide1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9090A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D0D0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9090A0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barSide2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8888A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8C8D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8888A0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barTop1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#D0D0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A8B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barTop2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F0F8;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#C8C8D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0A0B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vaultGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8B8D0;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#B8B8D0;stop-opacity:0" />
    </linearGradient>
    <filter id="barShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  <ellipse cx="400" cy="250" rx="350" ry="200" fill="url(#vaultGlow)"/>
  <!-- Platinum bars (left stack) -->
  <g transform="translate(140, 140)" filter="url(#barShadow)">
    <g>
      <path d="M0,0 L280,0 L295,18 L15,18 Z" fill="url(#barSide1)"/>
      <path d="M280,0 L295,18 L295,95 L280,77 Z" fill="#9090A0"/>
      <rect x="0" y="0" width="280" height="75" fill="url(#platBar)"/>
      <rect x="0" y="0" width="280" height="75" fill="url(#barTop1)"/>
      <rect x="15" y="10" width="250" height="14" rx="2" fill="#FFFFFF" opacity="0.25"/>
      <text x="140" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5A5A7A">999.5 PLATINUM</text>
      <text x="140" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5A5A7A">1 KILOGRAM • LPPM GOOD DELIVERY</text>
      <text x="140" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#6A6A8A" opacity="0.6">MELTER: VALCAMBI • SERIAL: PT-2024-003421</text>
    </g>
    <g transform="translate(18, -70)">
      <path d="M0,0 L240,0 L252,15 L12,15 Z" fill="url(#barSide1)"/>
      <path d="M240,0 L252,15 L252,85 L240,70 Z" fill="#9090A0"/>
      <rect x="0" y="0" width="240" height="68" fill="url(#platBar)"/>
      <rect x="0" y="0" width="240" height="68" fill="url(#barTop1)"/>
      <rect x="12" y="8" width="216" height="12" rx="2" fill="#FFFFFF" opacity="0.25"/>
      <text x="120" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5A5A7A">999.5 PLATINUM</text>
    </g>
    <g transform="translate(36, -135)">
      <path d="M0,0 L200,0 L208,12 L8,12 Z" fill="url(#barSide1)"/>
      <path d="M200,0 L208,12 L208,78 L200,66 Z" fill="#9090A0"/>
      <rect x="0" y="0" width="200" height="62" fill="url(#platBar)"/>
      <rect x="0" y="0" width="200" height="62" fill="url(#barTop1)"/>
      <rect x="8" y="6" width="184" height="10" rx="2" fill="#FFFFFF" opacity="0.25"/>
      <text x="100" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#5A5A7A">999.5 PLATINUM</text>
    </g>
  </g>
  <!-- Palladium bars (right stack) -->
  <g transform="translate(460, 140)" filter="url(#barShadow)">
    <g>
      <path d="M0,0 L280,0 L295,18 L15,18 Z" fill="url(#barSide2)"/>
      <path d="M280,0 L295,18 L295,95 L280,77 Z" fill="#8888A0"/>
      <rect x="0" y="0" width="280" height="75" fill="url(#pallBar)"/>
      <rect x="0" y="0" width="280" height="75" fill="url(#barTop2)"/>
      <rect x="15" y="10" width="250" height="14" rx="2" fill="#F0F0F8" opacity="0.3"/>
      <text x="140" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5A5A7A">999.5 PALLADIUM</text>
      <text x="140" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5A5A7A">1 KILOGRAM • LPPM GOOD DELIVERY</text>
      <text x="140" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#6A6A8A" opacity="0.6">MELTER: Heraeus • SERIAL: PD-2024-005678</text>
    </g>
    <g transform="translate(18, -70)">
      <path d="M0,0 L240,0 L252,15 L12,15 Z" fill="url(#barSide2)"/>
      <path d="M240,0 L252,15 L252,85 L240,70 Z" fill="#8888A0"/>
      <rect x="0" y="0" width="240" height="68" fill="url(#pallBar)"/>
      <rect x="0" y="0" width="240" height="68" fill="url(#barTop2)"/>
      <rect x="12" y="8" width="216" height="12" rx="2" fill="#F0F0F8" opacity="0.3"/>
      <text x="120" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5A5A7A">999.5 PALLADIUM</text>
    </g>
    <g transform="translate(36, -135)">
      <path d="M0,0 L200,0 L208,12 L8,12 Z" fill="url(#barSide2)"/>
      <path d="M200,0 L208,12 L208,78 L200,66 Z" fill="#8888A0"/>
      <rect x="0" y="0" width="200" height="62" fill="url(#pallBar)"/>
      <rect x="0" y="0" width="200" height="62" fill="url(#barTop2)"/>
      <rect x="8" y="6" width="184" height="10" rx="2" fill="#F0F0F8" opacity="0.3"/>
      <text x="100" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#5A5A7A">999.5 PALLADIUM</text>
    </g>
  </g>
  <!-- Center divider -->
  <line x1="400" y1="100" x2="400" y2="420" stroke="#5A5A7A" stroke-width="1" stroke-dasharray="8,8" opacity="0.3"/>
  <circle cx="400" cy="260" r="30" fill="none" stroke="#5A5A7A" stroke-width="1" opacity="0.2"/>
  <text x="400" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#5A5A7A" opacity="0.5">PGM VAULT</text>
  <!-- Sparkles -->
  <g filter="url(#glow)">
    <circle cx="200" cy="110" r="3.5" fill="#FFFFFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="100" r="3" fill="#E8E8F0" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="220" r="2.5" fill="#D8D8E0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#C8C8D8" opacity="0.9">PLATINUM & PALLADIUM INVESTMENT VAULT</text>
  <text x="400" y="525" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7A7A9A" opacity="0.7">LPPM GOOD DELIVERY • INDUSTRIAL GRADE • SECURED STORAGE</text>
</svg>